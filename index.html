<!DOCTYPE html>
<html>
<head>
  <title>KUHAZIQ</title>

  <style>
    body {
      margin: 0;
      background-color: #E6D7FF;
      font-family: Arial, sans-serif;
    }

    .logo {
      width: 150px;
      margin: 20px;
    }

    .box {
      background-color: #4B0082;
      color: #E0B3FF;
      width: 70%;
      margin: 50px auto;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    /* INTRO SCREEN */
    #intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      font-size: 60px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- 🏁 INTRO -->
<div id="intro">3</div>

<!-- 🌐 WEBSITE -->
<img src="https://via.placeholder.com/150" class="logo">

<div class="box">
  <h1>SELAMAT DATANG KE UNIT BIMBINGAN KAUNSELING WEBSITE</h1>
  <p>SEKOLAH MENENGAH SAINS KUBANG PASU</p>
</div>

<!-- ⚡ SCRIPT -->
<script>
let count = 3;
let intro = document.getElementById("intro");

let timer = setInterval(() => {

  count--;

  if (count > 0) {
    intro.innerText = count;
  } 
  else {
    intro.innerText = "GO!";
  }

  if (count < 0) {
    clearInterval(timer);
    intro.style.display = "none";
  }

}, 1000);
</script>

</body>
</html>
